<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgentOS - Chats</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 h-screen flex overflow-hidden">
    <aside class="w-64 bg-white border-r border-slate-200 flex flex-col justify-between hidden md:flex shrink-0">
        <div>
            <div class="h-16 flex items-center px-6 border-b border-slate-100 mb-4">
                <div class="flex items-center gap-2 text-indigo-600 cursor-pointer" onclick="window.location.href='dashboard-redesign.html'">
                    <i class="fa-solid fa-robot text-2xl"></i>
                    <span class="text-xl font-bold tracking-tight">AgentOS</span>
                </div>
            </div>

            <nav class="px-4 space-y-1">
                <a href="dashboard-redesign.html" class="flex items-center gap-3 px-3 py-2.5 text-slate-600 hover:bg-slate-50 hover:text-slate-900 rounded-lg font-medium transition-colors">
                    <i class="fa-solid fa-house w-5 text-center"></i> Home
                </a>
                <a href="chats.html" class="flex items-center gap-3 px-3 py-2.5 bg-indigo-50 text-indigo-600 rounded-lg font-medium border border-indigo-100/50">
                    <i class="fa-regular fa-comments w-5 text-center"></i> Chats
                </a>
                <a href="creates.html" class="flex items-center gap-3 px-3 py-2.5 text-slate-600 hover:bg-slate-50 hover:text-slate-900 rounded-lg font-medium transition-colors">
                    <i class="fa-solid fa-plus w-5 text-center"></i> Creates
                </a>
                <a href="plugins.html" class="flex items-center gap-3 px-3 py-2.5 text-slate-600 hover:bg-slate-50 hover:text-slate-900 rounded-lg font-medium transition-colors">
                    <i class="fa-solid fa-plug w-5 text-center"></i> Plugins
                </a>
                <a href="memory.html" class="flex items-center gap-3 px-3 py-2.5 text-slate-600 hover:bg-slate-50 hover:text-slate-900 rounded-lg font-medium transition-colors">
                    <i class="fa-solid fa-brain w-5 text-center"></i> Memory
                </a>
            </nav>
        </div>

        <div class="p-4 border-t border-slate-100">
            <a href="settings.html" class="flex items-center gap-3 px-3 py-2.5 text-slate-600 hover:bg-slate-50 hover:text-slate-900 rounded-lg font-medium transition-colors">
                <i class="fa-solid fa-gear w-5 text-center"></i> Settings
            </a>
        </div>
    </aside>

    <main class="flex-1 flex flex-col min-w-0 bg-white">
        <header class="h-16 border-b border-slate-200 flex items-center justify-between px-6 shrink-0 bg-white gap-4">
            <div class="flex items-center gap-4 flex-1 min-w-0">
                <h1 class="text-lg font-semibold text-slate-800 whitespace-nowrap">Chat History</h1>
                <div class="relative w-full max-w-xl">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input id="searchInput" type="text" placeholder="Search prompts, timestamps, and summaries..." class="w-full bg-slate-50 border border-slate-200 rounded-lg pl-9 pr-4 py-2 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-colors">
                </div>
            </div>
            <div class="flex items-center gap-3 shrink-0">
                <button id="authBtn" class="px-3 py-1.5 text-sm font-medium rounded-lg border transition-colors">Login</button>
                <button onclick="window.location.href='creates.html'" class="px-4 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium rounded-lg shadow-sm transition-colors flex items-center gap-2">
                    <i class="fa-solid fa-plus"></i> New Task
                </button>
            </div>
        </header>

        <div class="flex-1 overflow-hidden flex flex-col md:flex-row">
            <section class="md:w-96 border-r border-slate-200 bg-slate-50/50 flex flex-col shrink-0 min-h-[240px]">
                <div class="p-4 border-b border-slate-200 bg-white flex justify-between items-center gap-3">
                    <div>
                        <div class="text-sm font-medium text-slate-700">Recent Sessions</div>
                        <div id="sessionStats" class="text-xs text-slate-500 mt-0.5">No data loaded</div>
                    </div>
                    <button id="refreshBtn" class="w-8 h-8 rounded-lg border border-slate-200 text-slate-500 hover:text-indigo-600 hover:border-indigo-200 bg-white transition-colors" title="Refresh history">
                        <i class="fa-solid fa-rotate-right text-xs"></i>
                    </button>
                </div>

                <div id="chatsList" class="flex-1 overflow-y-auto p-3 space-y-2 scrollbar-hide">
                    <div class="text-center text-slate-400 text-sm py-8"><i class="fa-solid fa-spinner fa-spin"></i> Loading sessions...</div>
                </div>
            </section>

            <section class="flex-1 flex flex-col bg-white min-h-[300px]">
                <div id="previewEmpty" class="h-full flex items-center justify-center p-8 text-center bg-slate-50/30">
                    <div class="max-w-md">
                        <div class="w-16 h-16 bg-indigo-50 rounded-full flex items-center justify-center mx-auto mb-4 text-indigo-300 border border-indigo-100">
                            <i class="fa-regular fa-comments text-2xl"></i>
                        </div>
                        <h2 id="emptyTitle" class="text-lg font-semibold text-slate-800 mb-2">Select a session to view details</h2>
                        <p id="emptyDesc" class="text-sm text-slate-500 mb-6">Pick any session from the list to inspect prompt, runtime summary, and execution metadata.</p>
                        <button id="emptyActionBtn" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium rounded-lg shadow-sm w-full max-w-xs transition-colors hidden">
                            Go To Login
                        </button>
                    </div>
                </div>

                <div id="previewDetail" class="hidden flex-1 overflow-y-auto p-8 bg-slate-50/30">
                    <div class="max-w-3xl mx-auto w-full bg-white border border-slate-200 rounded-xl shadow-sm p-6">
                        <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
                            <h2 id="detailPrompt" class="text-lg font-semibold text-slate-800">-</h2>
                            <span id="detailCreatedAt" class="text-xs px-2 py-1 rounded-md bg-emerald-50 text-emerald-700 border border-emerald-100">-</span>
                        </div>

                        <p id="detailDesc" class="text-sm text-slate-600 leading-relaxed mb-6">-</p>

                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-6">
                            <div class="rounded-lg border border-slate-200 bg-slate-50 px-3 py-2">
                                <div class="text-[11px] uppercase tracking-wide text-slate-500">Steps</div>
                                <div id="detailSteps" class="text-sm font-semibold text-slate-800 mt-1">0</div>
                            </div>
                            <div class="rounded-lg border border-slate-200 bg-slate-50 px-3 py-2">
                                <div class="text-[11px] uppercase tracking-wide text-slate-500">Optimization</div>
                                <div id="detailOptimization" class="text-sm font-semibold text-slate-800 mt-1">0</div>
                            </div>
                            <div class="rounded-lg border border-slate-200 bg-slate-50 px-3 py-2">
                                <div class="text-[11px] uppercase tracking-wide text-slate-500">Memory Reuse</div>
                                <div id="detailMemory" class="text-sm font-semibold text-slate-800 mt-1">No</div>
                            </div>
                        </div>

                        <div class="flex flex-wrap gap-3">
                            <button id="openWorkspaceBtn" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium rounded-lg shadow-sm transition-colors">
                                Continue In Workspace
                            </button>
                            <button id="newTaskBtn" class="px-4 py-2 bg-white border border-slate-200 text-slate-700 text-sm font-medium rounded-lg hover:bg-slate-50 transition-colors">
                                Create New Task
                            </button>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script>
        (() => {
            const state = {
                token: localStorage.getItem("preview_demo_token") || "",
                sessions: [],
                filtered: [],
                selectedId: ""
            };

            const els = {
                authBtn: document.getElementById("authBtn"),
                searchInput: document.getElementById("searchInput"),
                refreshBtn: document.getElementById("refreshBtn"),
                sessionStats: document.getElementById("sessionStats"),
                chatsList: document.getElementById("chatsList"),
                previewEmpty: document.getElementById("previewEmpty"),
                emptyTitle: document.getElementById("emptyTitle"),
                emptyDesc: document.getElementById("emptyDesc"),
                emptyActionBtn: document.getElementById("emptyActionBtn"),
                previewDetail: document.getElementById("previewDetail"),
                detailPrompt: document.getElementById("detailPrompt"),
                detailCreatedAt: document.getElementById("detailCreatedAt"),
                detailDesc: document.getElementById("detailDesc"),
                detailSteps: document.getElementById("detailSteps"),
                detailOptimization: document.getElementById("detailOptimization"),
                detailMemory: document.getElementById("detailMemory"),
                openWorkspaceBtn: document.getElementById("openWorkspaceBtn"),
                newTaskBtn: document.getElementById("newTaskBtn")
            };

            function updateAuthButton() {
                if (state.token) {
                    els.authBtn.textContent = "Logout";
                    els.authBtn.className = "px-3 py-1.5 text-sm font-medium rounded-lg border border-emerald-200 text-emerald-700 bg-emerald-50 hover:bg-emerald-100 transition-colors";
                } else {
                    els.authBtn.textContent = "Login";
                    els.authBtn.className = "px-3 py-1.5 text-sm font-medium rounded-lg border border-indigo-200 text-indigo-700 bg-indigo-50 hover:bg-indigo-100 transition-colors";
                }
            }

            function setEmptyState(title, desc, withLoginAction) {
                els.previewDetail.classList.add("hidden");
                els.previewEmpty.classList.remove("hidden");
                els.emptyTitle.textContent = title;
                els.emptyDesc.textContent = desc;
                if (withLoginAction) {
                    els.emptyActionBtn.classList.remove("hidden");
                } else {
                    els.emptyActionBtn.classList.add("hidden");
                }
            }

            function formatDate(value) {
                if (!value) {
                    return "Unknown time";
                }
                const date = new Date(value);
                if (Number.isNaN(date.getTime())) {
                    return "Unknown time";
                }
                return date.toLocaleString();
            }

            function getSummary(item) {
                const summary = item && typeof item.summary === "object" ? item.summary : {};
                return {
                    steps: Number(summary.steps || 0),
                    optimization: Number(summary.optimization_rounds || 0),
                    memory: Boolean(summary.memory_reused)
                };
            }

            function applyFilter() {
                const query = els.searchInput.value.trim().toLowerCase();
                if (!query) {
                    state.filtered = state.sessions.slice();
                    return;
                }

                state.filtered = state.sessions.filter((item) => {
                    const summary = getSummary(item);
                    const haystack = [
                        String(item.prompt || ""),
                        String(item.created_at || ""),
                        String(summary.steps),
                        String(summary.optimization),
                        summary.memory ? "memory yes" : "memory no"
                    ].join(" ").toLowerCase();
                    return haystack.includes(query);
                });
            }

            function renderStats() {
                if (!state.token) {
                    els.sessionStats.textContent = "Login required";
                    return;
                }
                els.sessionStats.textContent = state.filtered.length + " / " + state.sessions.length + " sessions";
            }

            function renderList() {
                renderStats();

                if (!state.token) {
                    els.chatsList.innerHTML = '<div class="text-center text-slate-500 text-sm py-8">Login is required to view history.</div>';
                    return;
                }

                if (state.filtered.length === 0) {
                    els.chatsList.innerHTML = '<div class="text-center text-slate-500 text-sm py-8">No matching sessions found.</div>';
                    return;
                }

                const fragment = document.createDocumentFragment();
                state.filtered.forEach((item) => {
                    const summary = getSummary(item);
                    const card = document.createElement("button");
                    card.type = "button";
                    card.className = "w-full text-left bg-white border rounded-lg p-3 hover:border-indigo-300 transition-colors " + (item.id === state.selectedId ? "border-indigo-400 shadow-sm" : "border-slate-200");
                    card.innerHTML = [
                        '<div class="flex justify-between items-start mb-1 gap-2">',
                        '  <h3 class="font-medium text-slate-800 text-sm truncate">' + escapeHtml(item.prompt || "Untitled task") + '</h3>',
                        '</div>',
                        '<p class="text-xs text-slate-500 mb-2">Steps ' + summary.steps + ' • Optimization ' + summary.optimization + ' • Memory ' + (summary.memory ? "Yes" : "No") + '</p>',
                        '<span class="inline-flex items-center gap-1 px-1.5 py-0.5 bg-emerald-50 text-emerald-600 rounded text-[10px] font-medium border border-emerald-100">',
                        '  <i class="fa-regular fa-clock"></i> ' + escapeHtml(formatDate(item.created_at)),
                        '</span>'
                    ].join("");
                    card.addEventListener("click", () => {
                        state.selectedId = item.id;
                        renderList();
                        renderPreview();
                    });
                    fragment.appendChild(card);
                });

                els.chatsList.innerHTML = "";
                els.chatsList.appendChild(fragment);
            }

            function renderPreview() {
                const selected = state.sessions.find((item) => item.id === state.selectedId);
                if (!selected) {
                    setEmptyState(
                        "Select a session to view details",
                        "Pick any session from the left panel to inspect runtime metadata and continue work.",
                        false
                    );
                    return;
                }

                const summary = getSummary(selected);
                els.previewEmpty.classList.add("hidden");
                els.previewDetail.classList.remove("hidden");
                els.detailPrompt.textContent = selected.prompt || "Untitled task";
                els.detailCreatedAt.textContent = formatDate(selected.created_at);
                els.detailDesc.textContent = "This run is saved in history. You can continue from the dashboard or start a new task based on this prompt.";
                els.detailSteps.textContent = String(summary.steps);
                els.detailOptimization.textContent = String(summary.optimization);
                els.detailMemory.textContent = summary.memory ? "Yes" : "No";
            }

            function showLoading() {
                els.chatsList.innerHTML = '<div class="text-center text-slate-400 text-sm py-8"><i class="fa-solid fa-spinner fa-spin"></i> Loading sessions...</div>';
                renderStats();
            }

            async function loadSessions() {
                state.token = localStorage.getItem("preview_demo_token") || "";
                updateAuthButton();

                if (!state.token) {
                    state.sessions = [];
                    state.filtered = [];
                    state.selectedId = "";
                    renderList();
                    setEmptyState(
                        "Login required",
                        "History is protected by token authentication. Login first to load previous sessions.",
                        true
                    );
                    return;
                }

                showLoading();

                try {
                    const response = await fetch("/api/agent/history", {
                        headers: {
                            "Authorization": "Bearer " + state.token
                        }
                    });
                    const data = await response.json();

                    if (!response.ok || !data.ok || !Array.isArray(data.items)) {
                        throw new Error(data.message || "Failed to load chat history");
                    }

                    state.sessions = data.items.map((item, index) => ({
                        id: item.id || "session-" + index,
                        prompt: String(item.prompt || ""),
                        created_at: item.created_at,
                        summary: item.summary || {}
                    }));
                    applyFilter();

                    const selectedStillVisible = state.filtered.some((item) => item.id === state.selectedId);
                    if (!selectedStillVisible) {
                        state.selectedId = state.filtered.length > 0 ? state.filtered[0].id : "";
                    }

                    renderList();
                    renderPreview();
                } catch (error) {
                    state.sessions = [];
                    state.filtered = [];
                    state.selectedId = "";
                    els.chatsList.innerHTML = '<div class="text-center text-red-500 text-sm py-8">' + escapeHtml(error.message || "Failed to load sessions") + '</div>';
                    setEmptyState("History unavailable", "The server rejected this request. Try refreshing or login again.", true);
                }
            }

            function escapeHtml(value) {
                return String(value || "")
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/\"/g, "&quot;")
                    .replace(/'/g, "&#39;");
            }

            els.searchInput.addEventListener("input", () => {
                applyFilter();
                if (state.selectedId && !state.filtered.some((item) => item.id === state.selectedId)) {
                    state.selectedId = state.filtered.length > 0 ? state.filtered[0].id : "";
                }
                renderList();
                renderPreview();
            });

            els.refreshBtn.addEventListener("click", () => {
                loadSessions();
            });

            els.authBtn.addEventListener("click", () => {
                if (state.token) {
                    localStorage.removeItem("preview_demo_token");
                    state.token = "";
                    updateAuthButton();
                    loadSessions();
                    return;
                }
                window.location.href = "/";
            });

            els.emptyActionBtn.addEventListener("click", () => {
                window.location.href = "/";
            });

            els.openWorkspaceBtn.addEventListener("click", () => {
                const selected = state.sessions.find((item) => item.id === state.selectedId);
                if (selected && selected.prompt) {
                    localStorage.setItem("preview_prefill_prompt", selected.prompt);
                }
                window.location.href = "dashboard-redesign.html";
            });

            els.newTaskBtn.addEventListener("click", () => {
                window.location.href = "creates.html";
            });

            updateAuthButton();
            loadSessions();
        })();
    </script>
</body>
</html>
